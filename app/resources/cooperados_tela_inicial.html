<!--[main]-->
<link rel="stylesheet" href="app/lib/include/css/cooperados_tela_inicial.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<div class="cooperado-inicial-dashboard">

    <!-- CARDS -->
    <div class="cooperado-inicial-cards">
        <div class="cooperado-inicial-card cooperado-inicial-card-green">
            <div class="cooperado-inicial-icon">
                <i class="fas fa-user-group"></i>
            </div>
            <div class="cooperado-inicial-info">
                <span class="cooperado-inicial-label">Cooperados</span>
                <span class="cooperado-inicial-value">{$total_cooperados}</span>
            </div>
        </div>

        <div class="cooperado-inicial-card cooperado-inicial-card-orange">
            <div class="cooperado-inicial-icon">
                <i class="fas fa-file-circle-exclamation"></i>
            </div>
            <div class="cooperado-inicial-info">
                <span class="cooperado-inicial-label">Documentos vencidos</span>
                <span class="cooperado-inicial-value">{$docs_vencidos}</span>
            </div>
        </div>

        <div class="cooperado-inicial-card cooperado-inicial-card-blue">
            <div class="cooperado-inicial-icon">
                <i class="fas fa-people-group"></i>
            </div>
            <div class="cooperado-inicial-info">
                <span class="cooperado-inicial-label">Beneficiários</span>
                <span class="cooperado-inicial-value">{$beneficiarios}</span>
            </div>
        </div>
    </div>

    <!-- LISTAS -->
    <div class="cooperado-inicial-lists">

        <div class="cooperado-inicial-box">
            <h3>
                <i class="fas fa-cake-candles"></i>
                Aniversariantes (Próx. 7 dias)
            </h3>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Nome</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody>
                    {$lista_aniversariantes|raw}
                </tbody>
            </table>
        </div>

        <div class="cooperado-inicial-box">
            <h3>
                <i class="fas fa-user-slash"></i>
                Desfiliação (Próx. 60 dias)
            </h3>

            <table>
                <thead>
                    <tr>
                        <th>Data</th>
                        <th>Nome</th>
                        <th>Tempo</th>
                    </tr>
                </thead>
                <tbody>
                    {$lista_desfiliacao|raw}
                </tbody>
            </table>
        </div>

    </div>
</div>
<!--[/main]-->
